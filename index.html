<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060e" />
    <meta name="description" content="FABLE — a living website that watches how you move and writes a story only you will ever read. No menus. No pages. Only the drift." />
    <meta property="og:title" content="FABLE — the website that writes you" />
    <meta property="og:description" content="It learns the way you move. It remembers you. It writes a fable that exists for no one else." />
    <link rel="icon" type="image/svg+xml" href="/FableWebsite/ember.svg" />
    <title>FABLE — the website that writes you</title>
    <style>
      /* Paint the void before any JS arrives, so there is never a white flash */
      html, body { margin: 0; padding: 0; background: #05060e; height: 100%; }
      #boot {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #8a8fa8; font-family: Georgia, 'Times New Roman', serif; font-style: italic;
        font-size: 15px; letter-spacing: 0.18em; opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot" aria-hidden="true">the ink is still wet&hellip;</div></div>
    <noscript>
      <div style="position:fixed;inset:0;background:#05060e;color:#cfd3e8;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;padding:2rem;text-align:center;">
        FABLE is a living experience and needs JavaScript to breathe. Without it, only this sentence survives.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
